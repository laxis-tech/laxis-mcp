name: mcpb-ci

on:
  pull_request:
    paths:
      - "mcpb/**"
  push:
    branches: [main]
    paths:
      - "mcpb/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcpb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcpb/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes @anthropic-ai/mcpb validate manifest.json
      - name: Pack (sanity check, artifact not published)
        run: |
          npm prune --omit=dev
          npx --yes @anthropic-ai/mcpb pack . laxis.mcpb
